<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bigworld Agency | Coming Soon</title>
    <style>
        /* CSS Styling */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d0d1a; /* Dark modern background */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            padding: 40px 20px;
            max-width: 700px;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 25px;
            color: #cccccc;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #999999;
            margin-bottom: 40px;
        }

        .contact-box {
            display: inline-block;
            padding: 15px 30px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #1a1a2e;
        }

        .contact-box a {
            color: #4facfe;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .contact-box a:hover {
            color: #ffffff;
        }

        /* Simple fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 1.2rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bigworld Agency</h1>
        <h2>We are launching soon.</h2>
        
        <p>We are currently working hard behind the scenes to build our new website. We can't wait to share our vision with you. Check back shortly for updates.</p>
        
        <div class="contact-box">
            Get in touch: <br>
            <!-- Replace with your actual email address -->
            <a href="mailto:hello@bigworldagency.com">hello@bigworldagency.com</a>
        </div>
    </div>

</body>
</html>
